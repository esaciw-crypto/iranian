<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f3a5f">
<link rel="stylesheet" href="theme/theme.css"><link rel="stylesheet" href="ui/ui.css"><title>نور و صدای ایرانیان</title></head>
<body><main id="app">در حال آماده‌سازی…</main><nav id="nav" hidden></nav><script>
(function(){var a=document.getElementById('app');
if(location.protocol==='file:'||location.protocol==='content:'){a.innerHTML='<div class="card"><h3>این فایل را نمی‌شود مستقیم باز کرد</h3><p>برنامه باید از یک آدرس اینترنتی (https) باز شود، نه از داخل پوشه‌ی فایل‌ها. فایل‌ها را روی هاست آپلود کنید و آدرس را در Chrome باز کنید. برای تست سریع، فایل nsir-test.html را باز کنید.</p></div>';return;}
window.addEventListener('error',function(e){a.innerHTML='<div class="card bad">خطا در بارگذاری: '+(e.message||'')+'</div>';});
setTimeout(function(){if(a.textContent.indexOf('آماده‌سازی')>-1)a.innerHTML='<div class="card bad">برنامه بارگذاری نشد. آدرس باید https باشد و همه‌ی فایل‌ها (پوشه‌های js، ui، theme) کنار index.html آپلود شده باشند.</div>';},6000);})();
</script>
<script type="module" src="js/app.js"></script></body></html>
